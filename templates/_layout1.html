{% extends "_base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
 {# CSS do projeto#}
 <link rel="stylesheet" href="{% static 'css/base.css' %}">
 {% endblock  %}

 {% block header %}
 <div class ="container">
  <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
    <a href="{% url 'index' %}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
      <span class="fs-4">Carma</span>
    </a>
    <ul class="nav nav-pills">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
        <nav>
          <a href="{% url 'History' %}" class="nav-link px-2 link-dark">Historia do projeto</a>
          <a href="{% url 'ONU' %}" class="nav-link px-2 link-dark">Impacto do Projeto</a>
          <a href="{% url 'Contact' %}" class="nav-link px-2 link-dark">Equipe</a>
          <a href="{% url 'Cadastro' %}" class="nav-link px-2 link-dark">Cadastro</a>
          <a href="Login" class="btn btn-secondary btn-lg active" role="button" aria-pressed="true">Login</a>     
          <nav>

    </ul>
  </header>
 </div>
 {% endblock  %}
 <main>
    <div class="container">
        {% block content %}
            <!-- Este conteúdo será substituído em cada página filha -->
        {% endblock content %}
    </div>
</main>

 {% block footer %}
    <footer class="footer">
        <img src="{% static 'images/final_image.png' %}" alt="Final Image" class="final_image">
    </footer>
{% endblock %}
